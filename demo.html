<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Demo — B-star51</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    p  { color: #8b949e; margin-bottom: 24px; max-width: 440px; }
    .tip { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 20px; max-width: 440px; text-align: left; font-size: .88rem; color: #8b949e; }
    .tip strong { color: #58a6ff; display: block; margin-bottom: 8px; }
    .tip li { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>Chatbot Widget Demo</h1>
  <p>Click the 💬 button in the bottom-right corner to try it.</p>
  <div class="tip">
    <strong>Try asking:</strong>
    <ul>
      <li>hi</li>
      <li>what services do you offer?</li>
      <li>tell me about your projects</li>
      <li>what are your skills?</li>
      <li>how do I contact you?</li>
      <li>what is GhostFile?</li>
      <li>tell me a joke</li>
    </ul>
  </div>
  <script src="chatbot.js"></script>
</body>
</html>
